[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-flow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "ipykernel",
    "pyserial",
    "pypalmsens~=1.10.1",
    "PySide6>=6.8,<7"
]

[project.scripts]
autonomous-flow = "app:main"

[project.optional-dependencies]
web = ["nicegui~=3.14.0"]
dev = [
    "pyright~=1.1.411",
    "ruff~=0.16.3",
]

[tool.setuptools]
packages = ["analysis", "common", "config", "controllers", "fluidics", "gui", "palmsens", "runze", "storage", "engine", "adapters", "ui", "ui.qt"]
py-modules = ["app"]

[tool.setuptools.package-data]
"ui.qt" = ["assets/protocol/*.svg"]
